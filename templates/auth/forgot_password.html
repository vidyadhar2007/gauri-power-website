{% extends 'base.html' %}
{% block title %}Reset Password | Gauri Power{% endblock %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-16 px-4 bg-slate-50">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-200 space-y-6">
        <div class="text-center space-y-2">
            <h2 class="font-heading text-2xl font-bold text-industrial-900">Reset Account Password</h2>
            <p class="text-xs text-slate-500">Enter your registered email and we'll transmit a secure reset link.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="name@company.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:outline-none focus:border-electric-cyan">
            </div>
            <button type="submit" class="w-full py-3 rounded-xl text-xs font-bold text-white bg-industrial-900 hover:bg-industrial-800">
                Send Reset Link
            </button>
        </form>

        <div class="text-center">
            <a href="{{ url_for('auth.login') }}" class="text-xs text-electric-cyan hover:underline">&larr; Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
