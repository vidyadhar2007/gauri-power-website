version: '3.8'

services:
  web:
    build: .
    container_name: gauri_power_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=gauri-power-production-secret-key-2026
      - FLASK_ENV=production
    volumes:
      - ./instance:/app/instance
      - ./static/uploads:/app/static/uploads
